name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://127.0.0.1:18080
      DB_PASS: ci-database-password-not-a-secret
      SESSION_SECURE: "false"
      TMS_PORT: "18080"

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for healthy application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Create administrator
        run: |
          docker compose exec -T \
            -e TMS_ADMIN_PASSWORD=ci-admin-password-12345 \
            app php bin/create-admin.php ciadmin ciadmin@example.invalid

      - name: Verify task defaults and database ownership guard
        run: |
          db() {
            docker compose exec -T db mariadb -N -utms -p"$DB_PASS" tms -e "$1"
          }

          admin_id=$(db "SELECT id FROM users WHERE username = 'ciadmin' LIMIT 1")
          test -n "$admin_id"
          test "$(db "SELECT COUNT(*) FROM statuses WHERE user_id = $admin_id")" = "3"
          test "$(db "SELECT COUNT(*) FROM task_types WHERE user_id = $admin_id")" = "1"
          test "$(db "SELECT COUNT(*) FROM statuses WHERE user_id = $admin_id AND is_default = 1")" = "1"
          test "$(db "SELECT COUNT(*) FROM statuses WHERE user_id = $admin_id AND is_completion = 1")" = "1"

          db "INSERT INTO users (username, email, password_hash, role, is_active, approved_at) VALUES ('other', 'other@example.invalid', 'not-used', 'user', 1, UTC_TIMESTAMP())"
          other_id=$(db "SELECT id FROM users WHERE username = 'other' LIMIT 1")
          db "INSERT INTO statuses (user_id, name, color, sort_order) VALUES ($other_id, 'Foreign', '#111111', 1)"
          foreign_status=$(db "SELECT id FROM statuses WHERE user_id = $other_id AND name = 'Foreign' LIMIT 1")

          if db "INSERT INTO tasks (created_by, title, description, status_id) VALUES ($admin_id, 'Must fail', '', $foreign_status)"; then
            echo "Cross-user task/status foreign key unexpectedly accepted." >&2
            exit 1
          fi

      - name: Exercise login and persistent login
        run: |
          curl --fail --silent --cookie-jar /tmp/tms-cookies \
            http://127.0.0.1:18080/login > /tmp/login.html

          csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/login.html | head -n1)
          test -n "$csrf"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies --cookie-jar /tmp/tms-cookies \
            --data-urlencode "_csrf=$csrf" \
            --data-urlencode "username=ciadmin" \
            --data-urlencode "password=ci-admin-password-12345" \
            --data-urlencode "remember=1" \
            http://127.0.0.1:18080/login)
          test "$status" = "302"

          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/dashboard | grep -q 'TMS is running'

          remember=$(awk '$6 == "tms_remember" { print $7 }' /tmp/tms-cookies | tail -n1)
          test -n "$remember"

          curl --fail --silent --header "Cookie: tms_remember=$remember" \
            http://127.0.0.1:18080/dashboard | grep -q 'TMS is running'

      - name: Show stack state on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs || true

      - name: Stop stack
        if: always()
        run: docker compose down -v
