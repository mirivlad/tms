name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://127.0.0.1:18080
      APP_TIMEZONE: Asia/Tokyo
      APP_LOCALE: en
      DB_PASS: ci-database-password-not-a-secret
      SESSION_SECURE: "false"
      TMS_PORT: "18080"

    steps:
      - uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          node --check public/assets/board.js
          node --check public/assets/task-form.js

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for healthy application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Create administrator
        run: |
          docker compose exec -T \
            -e TMS_ADMIN_PASSWORD=ci-admin-password-12345 \
            app php bin/create-admin.php ciadmin ciadmin@example.invalid

      - name: Verify task defaults and database ownership guard
        run: |
          db() {
            docker compose exec -T db mariadb -N -utms -p"$DB_PASS" tms -e "$1"
          }

          admin_id=$(db "SELECT id FROM users WHERE username = 'ciadmin' LIMIT 1")
          test -n "$admin_id"
          test "$(db "SELECT COUNT(*) FROM statuses WHERE user_id = $admin_id")" = "3"
          test "$(db "SELECT COUNT(*) FROM task_types WHERE user_id = $admin_id")" = "1"
          test "$(db "SELECT COUNT(*) FROM statuses WHERE user_id = $admin_id AND is_default = 1")" = "1"
          test "$(db "SELECT COUNT(*) FROM statuses WHERE user_id = $admin_id AND is_completion = 1")" = "1"

          db "INSERT INTO users (username, email, password_hash, role, is_active, approved_at) VALUES ('other', 'other@example.invalid', 'not-used', 'user', 1, UTC_TIMESTAMP())"
          other_id=$(db "SELECT id FROM users WHERE username = 'other' LIMIT 1")
          db "INSERT INTO statuses (user_id, name, color, sort_order) VALUES ($other_id, 'Foreign', '#111111', 1)"
          foreign_status=$(db "SELECT id FROM statuses WHERE user_id = $other_id AND name = 'Foreign' LIMIT 1")

          if db "INSERT INTO tasks (created_by, title, description, status_id) VALUES ($admin_id, 'Must fail', '', $foreign_status)"; then
            echo "Cross-user task/status foreign key unexpectedly accepted." >&2
            exit 1
          fi

          foreign_month=$(TZ="$APP_TIMEZONE" date +%Y-%m)
          db "INSERT INTO tasks (created_by, title, description, status_id, deadline) VALUES ($other_id, 'Foreign calendar leak', '', $foreign_status, '${foreign_month}-15 13:00:00')"

      - name: Exercise authenticated task workflow
        run: |
          db() {
            docker compose exec -T db mariadb -N -utms -p"$DB_PASS" tms -e "$1"
          }

          curl --fail --silent --cookie-jar /tmp/tms-cookies \
            http://127.0.0.1:18080/login > /tmp/login-en.html

          grep -q '<html lang="en">' /tmp/login-en.html
          grep -q '>Sign in<' /tmp/login-en.html
          csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/login-en.html | head -n1)
          test -n "$csrf"

          locale_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies --cookie-jar /tmp/tms-cookies \
            --referer http://127.0.0.1:18080/login \
            --data-urlencode "_csrf=$csrf" \
            --data-urlencode "locale=ru" \
            http://127.0.0.1:18080/locale)
          test "$locale_status" = "302"

          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/login > /tmp/login-ru.html
          grep -q '<html lang="ru">' /tmp/login-ru.html
          grep -q '>Вход<' /tmp/login-ru.html
          login_csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/login-ru.html | head -n1)
          test -n "$login_csrf"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies --cookie-jar /tmp/tms-cookies \
            --data-urlencode "_csrf=$login_csrf" \
            --data-urlencode "username=ciadmin" \
            --data-urlencode "password=ci-admin-password-12345" \
            --data-urlencode "remember=1" \
            http://127.0.0.1:18080/login)
          test "$status" = "302"

          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/dashboard > /tmp/dashboard-ru.html
          grep -q '<html lang="ru">' /tmp/dashboard-ru.html
          grep -q 'Обзор задач' /tmp/dashboard-ru.html

          dashboard_csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/dashboard-ru.html | head -n1)
          test -n "$dashboard_csrf"
          locale_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies --cookie-jar /tmp/tms-cookies \
            --referer http://127.0.0.1:18080/dashboard \
            --data-urlencode "_csrf=$dashboard_csrf" \
            --data-urlencode "locale=en" \
            http://127.0.0.1:18080/locale)
          test "$locale_status" = "302"

          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/dashboard > /tmp/dashboard-en.html
          grep -q '<html lang="en">' /tmp/dashboard-en.html
          grep -q 'Task overview' /tmp/dashboard-en.html

          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/tasks/new > /tmp/task-form.html
          task_csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/task-form.html | head -n1)
          default_status=$(sed -n 's/.*<option value="\([0-9][0-9]*\)" selected>.*/\1/p' /tmp/task-form.html | head -n1)
          test -n "$task_csrf"
          test -n "$default_status"

          calendar_month=$(TZ="$APP_TIMEZONE" date +%Y-%m)
          create_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies \
            --data-urlencode "_csrf=$task_csrf" \
            --data-urlencode "title=CI urgent task" \
            --data-urlencode "description=Created through the real web form" \
            --data-urlencode "status_id=$default_status" \
            --data-urlencode "priority=urgent" \
            --data-urlencode "deadline=${calendar_month}-15T12:00" \
            --data-urlencode "customer=CI Customer" \
            http://127.0.0.1:18080/tasks)
          test "$create_status" = "302"

          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/tasks | grep -q 'CI urgent task'
          curl --fail --silent --cookie /tmp/tms-cookies \
            http://127.0.0.1:18080/board > /tmp/board.html
          grep -q 'CI urgent task' /tmp/board.html
          grep -q 'draggable="true"' /tmp/board.html
          grep -q '/assets/board.js' /tmp/board.html

          curl --fail --silent --cookie /tmp/tms-cookies \
            "http://127.0.0.1:18080/calendar?month=$calendar_month" > /tmp/calendar.html
          grep -q 'CI urgent task' /tmp/calendar.html
          if grep -q 'Foreign calendar leak' /tmp/calendar.html; then
            echo "Calendar leaked another user's task." >&2
            exit 1
          fi

          admin_id=$(db "SELECT id FROM users WHERE username = 'ciadmin' LIMIT 1")
          task_id=$(db "SELECT id FROM tasks WHERE created_by = $admin_id AND title = 'CI urgent task' LIMIT 1")
          test -n "$task_id"
          test "$(db "SELECT COUNT(*) FROM customers WHERE user_id = $admin_id AND name = 'CI Customer'")" = "1"

          created_at=$(db "SELECT DATE_FORMAT(created_at, '%Y-%m-%d %H:%i') FROM tasks WHERE id = $task_id")
          expected_now=$(TZ="$APP_TIMEZONE" date '+%Y-%m-%d %H:%M')
          expected_previous=$(TZ="$APP_TIMEZONE" date -d '1 minute ago' '+%Y-%m-%d %H:%M')
          if [ "$created_at" != "$expected_now" ] && [ "$created_at" != "$expected_previous" ]; then
            echo "Task timestamp $created_at does not match configured APP_TIMEZONE=$APP_TIMEZONE." >&2
            exit 1
          fi

          in_progress=$(db "SELECT id FROM statuses WHERE user_id = $admin_id AND name = 'In progress' LIMIT 1")
          move_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies \
            --data-urlencode "_csrf=$task_csrf" \
            --data-urlencode "status_id=$in_progress" \
            http://127.0.0.1:18080/tasks/$task_id/status)
          test "$move_status" = "302"
          test "$(db "SELECT status_id FROM tasks WHERE id = $task_id")" = "$in_progress"

          foreign_status=$(db "SELECT s.id FROM statuses s JOIN users u ON u.id=s.user_id WHERE u.username='other' AND s.name='Foreign' LIMIT 1")
          rejected=$(curl --silent --output /tmp/rejected.html --write-out '%{http_code}' \
            --cookie /tmp/tms-cookies \
            --data-urlencode "_csrf=$task_csrf" \
            --data-urlencode "title=Foreign status attack" \
            --data-urlencode "status_id=$foreign_status" \
            --data-urlencode "priority=medium" \
            http://127.0.0.1:18080/tasks)
          test "$rejected" = "422"
          test "$(db "SELECT COUNT(*) FROM tasks WHERE title='Foreign status attack'")" = "0"

          remember=$(awk '$6 == "tms_remember" { print $7 }' /tmp/tms-cookies | tail -n1)
          test -n "$remember"
          curl --fail --silent --header "Cookie: tms_remember=$remember" \
            http://127.0.0.1:18080/dashboard | grep -q 'Task overview'

      - name: Exercise rich task form parity
        run: bash tests/smoke/task-form-parity.sh

      - name: Exercise metadata administration
        run: bash tests/smoke/metadata.sh

      - name: Show stack state on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs || true

      - name: Stop stack
        if: always()
        run: docker compose down -v