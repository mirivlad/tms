name: Version release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          case "$version" in
            *[!0-9A-Za-z.-]*) echo "Invalid VERSION: $version" >&2; exit 1 ;;
          esac
          if [[ "$version" == *-* ]]; then
            channel=preview
            prerelease=true
          else
            channel=latest
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite its image tag." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify public multi-arch manifest and anonymous pull
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          manifest="$(docker buildx imagetools inspect "$IMAGE")"
          grep -Fq 'linux/amd64' <<< "$manifest"
          grep -Fq 'linux/arm64' <<< "$manifest"
          docker pull "$IMAGE"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            intro='Public TMS preview intended for self-hosted feature and UI evaluation.'
            outro='This is a prerelease. Use the versioned image tag when evaluating it.'
          else
            intro='TMS stable release for self-hosted task management.'
            outro="Stable ${TAG} is the supported baseline for subsequent compatible fixes and incremental releases."
          fi
          notes=$(cat <<EOF
          $intro

          Included:
          - secure login, persistent sessions and password recovery;
          - isolated multi-user task data, metadata and attachments;
          - dashboard counters, status distribution, stale tasks and daily tips;
          - task list, Kanban board and calendar with advanced filtering;
          - global quick add, task quick view with inline status/description/deadline editing and bulk task operations;
          - rich-text descriptions, customers and owner-scoped custom fields;
          - type-aware custom-field editing, money formatting and typed task filters;
          - personal and team-owned projects with project files, project-specific task statuses and custom fields;
          - teams with lead/member roles, invitations and task assignees;
          - project/task discussions with shallow replies, @mentions and canonical in-app unread notifications;
          - collaboration ACL hardening and a tested v0.1.4-to-v0.2.0 database upgrade path;
          - per-user timezone, notification preferences and six interface theme modes;
          - desktop-first Projects and Teams management, with collaboration setup moved out of the primary work navigation into the user menu;
          - selector-first Projects navigation, project settings on the project detail page, and Overview summaries for projects, teams and unassigned work;
          - calendar day quick-add, customer autocomplete and wheel-aware wide-board navigation;
          - optional self-registration with visual CAPTCHA, email verification and administrator approval;
          - administrator user management, direct account creation, quick user details and impersonation;
          - SMTP/email and Telegram notification delivery with administrator-managed credentials, selectable Long polling/Webhook command delivery, independently saved HTTP/SOCKS proxy settings and per-user Telegram delivery testing;
          - Russian and English interface catalogs;
          - MariaDB migrations, first-admin CLI bootstrap, Docker Compose and Portainer deployment.

          $outro

          Container image:
          \`ghcr.io/mirivlad/tms:${TAG}\`
          EOF
          )

          printf '%s\n' "$notes" > /tmp/release-notes.md
          args=(
            "$TAG"
            --target "$GITHUB_SHA"
            --title "TMS $TAG"
            --notes-file /tmp/release-notes.md
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
