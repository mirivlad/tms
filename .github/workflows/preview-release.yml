name: Version release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          case "$version" in
            *[!0-9A-Za-z.-]*) echo "Invalid VERSION: $version" >&2; exit 1 ;;
          esac
          if [[ "$version" == *-* ]]; then
            channel=preview
            prerelease=true
          else
            channel=latest
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite its image tag." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify public multi-arch manifest and anonymous pull
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          manifest="$(docker buildx imagetools inspect "$IMAGE")"
          grep -Fq 'linux/amd64' <<< "$manifest"
          grep -Fq 'linux/arm64' <<< "$manifest"
          docker pull "$IMAGE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/handbook-requirements.txt

      - name: Build release handbooks
        run: |
          python3 -m pip install -r docs/handbook-requirements.txt
          python3 scripts/build-handbooks.py --output build/handbooks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            intro='Public TMS preview intended for self-hosted feature and UI evaluation.'
            outro='This is a prerelease. Use the versioned image tag when evaluating it.'
          else
            intro='TMS stable release for self-hosted task management.'
            outro="Stable ${TAG} is the supported baseline for subsequent compatible fixes and incremental releases."
          fi
          notes=$(cat <<EOF
          $intro

          Included:
          - secure login, persistent sessions and password recovery;
          - isolated multi-user task data, metadata and attachments;
          - dashboard counters, status distribution, stale tasks and daily tips;
          - task list, Kanban board and calendar with advanced filtering;
          - independent planned work time (scheduled_at) and deadline semantics across task forms, quick edit, filters, Saved Views, Calendar and recurring occurrences;
          - realtime notification and invitation badges that refresh while the page is open without requiring a full reload;
          - durable versioned domain-event journal powering activity history, notifications and external integrations;
          - append-only task and project activity history for meaningful changes;
          - ordered task checklists with progress tracking and activity events;
          - private saved task views for reusable filters, sorting, project scope and an optional default view;
          - recurring task series with daily, weekly, monthly, every-N-days and N-days-after-completion schedules, generated idempotently as new task occurrences;
          - dense responsive workbench layout across dashboard, tasks, projects, teams, discussions, notifications and administration, with mobile task cards and focused navigation;
          - project-aware status filters in Tasks and Calendar: No project uses personal statuses, a selected project uses its workflow, and All projects exposes all accessible statuses;
          - global quick add, task quick view with inline status/description/deadline editing and bulk task operations;
          - rich-text descriptions, customers and owner-scoped custom fields;
          - type-aware custom-field editing, money formatting and typed task filters;
          - personal and team-owned projects with project files, project-specific task statuses and custom fields;
          - teams with lead/member roles, invitations and task assignees;
          - dedicated task discussion workspaces with rich editing for new comments, replies and edits;
          - project discussion aggregation across project-level and task-level threads, grouped by task;
          - redesigned discussion workspaces with a compact integrated composer, flatter message hierarchy, reply rails and a desktop task-discussion sidebar;
          - discussion counters and unread indicators on task/project surfaces with per-user, per-team read cursors;
          - project/task discussions with shallow replies, @mentions and canonical in-app notifications;
          - collaboration ACL hardening and a tested v0.1.4-to-v0.2.0 database upgrade path;
          - per-user timezone, notification preferences and six interface theme modes;
          - Projects and Teams available directly from the primary desktop navigation, with notifications, invitations and application settings grouped inside the user menu;
          - focused Project workspaces with separate Overview, Settings, Statuses, Custom fields, Files and Discussion pages;
          - project status editing aligned with the compact personal-status UI;
          - focused Team workspaces with separate Overview, Settings and Members pages, plus modal creation and invitations;
          - secure project ownership transfer between personal and team scopes, including team-scoped discussion history and cleanup of stale assignees/personal task metadata;
          - Overview summaries for projects, teams and unassigned work;
          - calendar day quick-add and customer autocomplete;
          - pre-v0.2.7 Kanban wheel handoff: scroll the active column vertically while possible, then continue across the board horizontally at the column boundary, with Shift-wheel available for immediate horizontal movement;
          - continuous desktop Kanban wheel scrolling without CSS scroll-snap interference; mobile swipe snapping remains enabled;
          - conditional, color-distinct notification and invitation badges beside the username, rendered only when their counters are non-zero;
          - viewport-aware Kanban sizing that keeps the horizontal board scroller reachable when filters or selectors appear above it;
          - explicit expand/collapse state indication for the task-list Filters accordion;
          - optional self-registration with visual CAPTCHA, email verification and administrator approval;
          - administrator user management, direct account creation, quick user details and impersonation;
          - event-driven in-app notifications for assignment/reassignment, planned/deadline changes, optional status changes, discussion replies and mentions, with email/Telegram as optional transports;
          - scheduled reminders for both planned work and deadlines, including owner/assignee access checks and canonical in-app history;
          - SMTP/email and Telegram notification delivery with administrator-managed credentials, selectable Long polling/Webhook command delivery, independently saved HTTP/SOCKS proxy settings and per-user Telegram delivery testing;
          - administrator-managed signed outbound webhooks with selectable domain events, encrypted signing secrets, durable queue recovery, HMAC verification, retry/backoff and delivery history;
          - maintained English/Russian user and administrator handbooks generated as HTML/PDF and attached to each release;
          - Russian and English interface catalogs with count-aware pluralization for natural numeric UI labels;
          - MariaDB migrations, first-admin CLI bootstrap, Docker Compose and Portainer deployment.

          $outro

          Container image:
          \`ghcr.io/mirivlad/tms:${TAG}\`
          EOF
          )

          printf '%s\n' "$notes" > /tmp/release-notes.md
          assets=(
            build/handbooks/user-handbook-en.html
            build/handbooks/user-handbook-en.pdf
            build/handbooks/user-handbook-ru.html
            build/handbooks/user-handbook-ru.pdf
            build/handbooks/admin-handbook-en.html
            build/handbooks/admin-handbook-en.pdf
            build/handbooks/admin-handbook-ru.html
            build/handbooks/admin-handbook-ru.pdf
          )
          args=(
            "$TAG"
            "${assets[@]}"
            --target "$GITHUB_SHA"
            --title "TMS $TAG"
            --notes-file /tmp/release-notes.md
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
